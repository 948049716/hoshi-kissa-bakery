name: Deploy WeChat MiniGame & CloudBase

on:
  workflow_dispatch:
    inputs:
      version:
        description: '小游戏版本号 (例如 4.0.1，留空自动按构建号递增)'
        required: false
        default: ''
      desc:
        description: '版本备注'
        required: false
        default: '云开发与小游戏自动部署'
  push:
    branches:
      - main
    paths:
      - '05-微信小游戏版本/**'
      - 'scripts/ci_upload_minigame.mjs'
      - '.github/workflows/deploy-wechat-minigame.yml'

jobs:
  deploy-cloudfunction:
    name: 部署微信云函数 (kissa_sync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check Cloud Function & Client JS
        run: |
          for f in 05-微信小游戏版本/game.js 05-微信小游戏版本/src/*.js 05-微信小游戏版本/cloudfunctions/kissa_sync/index.js; do
            node --check "$f"
          done

      - name: Deploy kissa_sync to CloudBase (dev-d0ggz3zx89d349af3)
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: dev-d0ggz3zx89d349af3
        run: |
          if [ -z "$TCB_SECRET_ID" ] || [ -z "$TCB_SECRET_KEY" ]; then
            echo "::notice::未配置 TCB_SECRET_ID / TCB_SECRET_KEY，跳过云函数自动部署。"
            exit 0
          fi
          npm --prefix "$RUNNER_TEMP/tcb" install --no-save @cloudbase/cli
          TCB_BIN="$RUNNER_TEMP/tcb/node_modules/.bin/tcb"
          "$TCB_BIN" login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

          FOUND_REGION=""
          for r in ap-shanghai ap-guangzhou ap-beijing ap-chengdu; do
            echo "Checking CloudBase region: $r ..."
            OUT=$("$TCB_BIN" env list -r "$r" 2>&1 || true)
            if echo "$OUT" | grep -q "$TCB_ENV_ID"; then
              FOUND_REGION="$r"
              echo "Found $TCB_ENV_ID in region: $FOUND_REGION"
              break
            fi
          done

          if [ -z "$FOUND_REGION" ]; then
            echo "::warning::当前 SecretId 账号下未找到环境 $TCB_ENV_ID，跳过云函数自动部署（可在微信开发者工具右键 kissa_sync 上传并部署）。"
            exit 0
          fi

          "$TCB_BIN" fn deploy kissa_sync --dir 05-微信小游戏版本/cloudfunctions/kissa_sync -e "$TCB_ENV_ID" -r "$FOUND_REGION" --force

  upload-minigame:
    name: 上传微信小游戏体验版 (miniprogram-ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install miniprogram-ci cleanly in runner temp
        run: |
          mkdir -p "$RUNNER_TEMP/mpci"
          npm --prefix "$RUNNER_TEMP/mpci" install --no-save miniprogram-ci@latest

      - name: Upload Mini Game via miniprogram-ci
        env:
          MINIPROGRAM_CI_PATH: ${{ runner.temp }}/mpci/node_modules/miniprogram-ci
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY || secrets.WX_PRIVATE_KEY }}
          WECHAT_ACTION: upload
          WECHAT_VERSION: ${{ inputs.version != '' && inputs.version || format('2.0.{0}', github.run_number) }}
          WECHAT_DESC: ${{ inputs.desc != '' && inputs.desc || '一起做猫饼 v2.0 体验版上传' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/upload_minigame.mjs
