name: WeChat Mini Game CI

on:
  push:
    branches:
      - main
    paths:
      - '05-微信小游戏版本/**'
      - 'scripts/*.mjs'
      - '.github/workflows/minigame-ci.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'CI 操作类型 (upload 上传代码版本 / preview 生成体验二维码)'
        required: true
        default: 'upload'
        type: choice
        options:
          - upload
          - preview
      version:
        description: '版本号 (留空则自动按 GAME_VERSION 生成 <MAJOR>.<MINOR>.<run_number>，如 0.9.<run_number>)'
        required: false
        default: ''
        type: string
      desc:
        description: '版本备注 (留空则使用当前提交信息)'
        required: false
        default: ''
        type: string

concurrency:
  group: minigame-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 单测、30关静态校验与 E2E 自动化验证
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check Mini Game, Cloud Function & scripts
        run: |
          for f in 05-微信小游戏版本/game.js 05-微信小游戏版本/src/*.js 05-微信小游戏版本/openDataContext/*.js 05-微信小游戏版本/cloudfunctions/kissa_sync/index.js scripts/*.mjs; do
            node --check "$f"
          done

      - name: Run v2 L1 core unit & L2 30-level static tests
        run: node scripts/test_v2_core.mjs

      - name: Balance simulator gate (30 levels × 3 bot profiles × 6 seeds)
        run: node scripts/sim_balance.mjs --check --seeds 6

      - name: Validate WeChat Mini Game uploader dry-run
        run: node scripts/upload_minigame.mjs --dry-run

      - name: Check headless browser binary
        run: |
          which google-chrome chromium chromium-browser || true
          echo "CHROME_BIN=${CHROME_BIN:-unset}"

      - name: Run headless Chrome Mini Game E2E suite
        env:
          CHROME_USER_DATA_DIR: ${{ runner.temp }}/chrome_profile
          VERIFY_OUT_DIR: ${{ runner.temp }}/minigame_verify
        run: node scripts/verify_minigame_e2e.mjs

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minigame-e2e-screenshots
          path: |
            /tmp/minigame_verify
            ${{ runner.temp }}/minigame_verify
          if-no-files-found: ignore
          retention-days: 7

  upload:
    name: 部署云函数与上传微信体验版
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy kissa_sync to CloudBase (dev-d0ggz3zx89d349af3)
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'upload'
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: dev-d0ggz3zx89d349af3
        run: |
          if [ -z "$TCB_SECRET_ID" ] || [ -z "$TCB_SECRET_KEY" ]; then
            echo "::notice::未配置 TCB_SECRET_ID / TCB_SECRET_KEY，跳过云函数自动部署。"
            exit 0
          fi
          npm --prefix "$RUNNER_TEMP/tcb" install --no-save @cloudbase/cli
          TCB_BIN="$RUNNER_TEMP/tcb/node_modules/.bin/tcb"
          "$TCB_BIN" login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

          FOUND_REGION=""
          for r in ap-shanghai ap-guangzhou ap-beijing ap-chengdu; do
            echo "Checking CloudBase region: $r ..."
            OUT=$("$TCB_BIN" env list -r "$r" 2>&1 || true)
            if echo "$OUT" | grep -q "$TCB_ENV_ID"; then
              FOUND_REGION="$r"
              echo "Found $TCB_ENV_ID in region: $FOUND_REGION"
              break
            fi
          done

          if [ -z "$FOUND_REGION" ]; then
            echo "::warning::当前 SecretId 账号下未找到环境 $TCB_ENV_ID，跳过云函数自动部署（可在微信开发者工具右键 kissa_sync 上传并部署）。"
            exit 0
          fi

          "$TCB_BIN" fn deploy kissa_sync --dir 05-微信小游戏版本/cloudfunctions/kissa_sync -e "$TCB_ENV_ID" -r "$FOUND_REGION" --force

      - name: Install miniprogram-ci cleanly in runner temp
        run: |
          mkdir -p "$RUNNER_TEMP/mpci"
          npm --prefix "$RUNNER_TEMP/mpci" install --no-save miniprogram-ci@latest

      - name: Upload / Preview Mini Game via miniprogram-ci
        env:
          MINIPROGRAM_CI_PATH: ${{ runner.temp }}/mpci/node_modules/miniprogram-ci
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY || secrets.WX_PRIVATE_KEY }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'upload' }}
          WECHAT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          WECHAT_DESC: ${{ github.event_name == 'workflow_dispatch' && inputs.desc || '' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/upload_minigame.mjs

      - name: Upload preview QR code artifact
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: wechat-preview-qrcode
          path: ${{ runner.temp }}/wechat_preview_qrcode.jpg
          if-no-files-found: ignore
          retention-days: 3
